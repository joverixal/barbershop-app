<!DOCTYPE html>
<html>
<head>

<title>Barbershop App - Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="assets/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="assets/vendor/toastr.min.css">

<script src="assets/vendor/jquery.min.js"></script>
<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/toastr.min.js"></script>

<script src="assets/js/helper.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/model.js"></script>

<script src="assets/js/auth.js"></script>

<style>

body {
  background: linear-gradient(135deg, #7A2BE2, #00B7C2);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

/* LOGIN WRAPPER */
.login-box {
  width: 100%;
  max-width: 380px;
  padding: 15px;
}

/* LOGIN CARD */
.login-card {
  background: #fff;
  border-radius: 12px;
  padding: 18px;
  border: 1px solid #eee;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

/* HEADER INSIDE CARD */
.login-header {
  text-align: center;
  margin-bottom: 15px;
}

.login-logo {
  width: 50px;
  margin-bottom: 5px;
}

.login-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: #5A1FAF;
}

/* INPUTS */
.form-control {
  border-radius: 10px;
  font-size: 0.9rem;
}

.form-control:focus {
  border-color: #00B7C2;
  box-shadow: 0 0 0 0.15rem rgba(0,183,194,0.2);
}

/* BUTTON */
.login-btn {
  background: linear-gradient(135deg, #7A2BE2, #00B7C2);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-weight: 500;
}

.login-btn:hover {
  opacity: 0.9;
}

</style>

</head>

<body>

<div class="login-box">

  <!-- LOGIN CARD -->
  <div class="login-card">

    <!-- HEADER INSIDE CARD -->
    <div class="login-header">
      <img src="assets/images/app-icon.png" class="login-logo" alt="Logo">
      <div class="login-title">Barbershop POS</div>
    </div>

    <!-- FORM -->
    <form id="frm-login">

      <div class="mb-2">
        <input type="text" id="inp-username" class="form-control" placeholder="Username" required>
      </div>

      <div class="mb-3">
        <input type="password" id="inp-password" class="form-control" placeholder="Password" required>
      </div>

      <button type="button" class="btn login-btn w-100" id="btn-login">
        Login
      </button>

    </form>

  </div>

</div>

</body>
</html>
