<!DOCTYPE html>
<html>
<head>

<title>Barbershop App - Earnings</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../assets/vendor/toastr.min.css">
<link rel="stylesheet" href="../assets/css/menu.css">

<script src="../assets/vendor/jquery.min.js"></script>
<script src="../assets/vendor/bootstrap.bundle.min.js"></script>
<script src="../assets/vendor/toastr.min.js"></script>

<script src="../assets/js/helper.js"></script>
<script src="../assets/js/earnings.index.js"></script>

<style>

body {
  background: linear-gradient(135deg, #7A2BE2, #00B7C2);
  margin: 0;
}

/* MAIN */
.main {
  padding: 15px;
  padding-bottom: 100px;
}

/* HEADER */
.page-title {
  color: #fff;
  font-weight: 600;
  margin-bottom: 10px;
}

/* FILTER BUTTONS (compact like POS) */
.filter-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  overflow-x: auto;
}

.filter-btn {
  border-radius: 20px;
  font-size: 0.85rem;
  padding: 6px 12px;
  white-space: nowrap;
}

.filter-btn.active {
  background: linear-gradient(135deg, #7A2BE2, #00B7C2);
  color: #fff;
  border: none;
}

/* DATE RANGE (flat style, no card) */
.range-box {
  display: flex;
  gap: 8px;
  align-items: end;
  background: #fff;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.range-box input {
  font-size: 0.85rem;
}

/* APPLY BUTTON (icon only) */
.apply-btn {
  width: 42px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* SUMMARY (POS STYLE, NO CARD BOX SHADOW HEAVY) */
.summary {
  background: #fff;
  border-radius: 10px;
  padding: 12px;
  border: 1px solid #eee;
  margin-bottom: 10px;
}

.summary-title {
  font-size: 0.85rem;
  color: #666;
}

.summary-amount {
  font-size: 2rem;
  font-weight: bold;
  color: #00B7C2;
}

/* TRANSACTION LIST (flat POS style) */
.tx-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}

.tx-item {
  background: #fff;
  padding: 10px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  border: 1px solid #eee;
}

.tx-amount {
  font-weight: bold;
  color: #00B7C2;
}

</style>

</head>

<body>

<div id="menu-container"></div>

<div class="main">

  <div class="page-title">💰 Earnings</div>

  <!-- FILTERS -->
  <div class="filter-row">

    <button class="btn btn-light filter-btn active" data-filter="today">Today</button>
    <button class="btn btn-light filter-btn" data-filter="week">Week</button>
    <button class="btn btn-light filter-btn" data-filter="month">Month</button>

  </div>

  <!-- DATE RANGE -->
  <div class="range-box">

    <div>
      <label class="form-label mb-1">From</label>
      <input type="date" id="date-from" class="form-control form-control-sm">
    </div>

    <div>
      <label class="form-label mb-1">To</label>
      <input type="date" id="date-to" class="form-control form-control-sm">
    </div>

    <button class="btn btn-primary apply-btn" id="btn-range" title="Apply">
      <i class="bi bi-funnel-fill"></i>
    </button>

  </div>

  <!-- SUMMARY -->
  <div class="summary">

    <div class="summary-title" id="filter-title">Today Earnings</div>
    <div class="summary-amount" id="filter-amount">₱0.00</div>

    <small class="text-muted" id="filter-subtext">
      Updated in real-time
    </small>

  </div>

  <!-- TRANSACTIONS (POS STYLE LIST) -->
  <div class="tx-list" id="tbl-earnings">

    <div class="tx-item">
      <span>No records yet</span>
      <span class="tx-amount">₱0.00</span>
    </div>

  </div>

</div>

<script>

$("#menu-container").load("../shared/menu.html", function () {
    $.getScript("../assets/js/menu.js");
});

</script>

</body>
</html>
